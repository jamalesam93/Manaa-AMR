<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Shield shape -->
  <path d="M50 5 L90 20 L90 50 C90 75 50 95 50 95 C50 95 10 75 10 50 L10 20 Z" 
        fill="url(#shieldGradient)" 
        stroke="#1a5f5f" 
        stroke-width="3"/>
  
  <!-- Inner shield highlight -->
  <path d="M50 12 L82 24 L82 48 C82 68 50 85 50 85 C50 85 18 68 18 48 L18 24 Z" 
        fill="url(#innerGradient)" 
        opacity="0.9"/>
  
  <!-- Checkmark/protection symbol -->
  <path d="M35 50 L45 62 L68 38" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="6" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
  
  <!-- Gradients -->
  <defs>
    <linearGradient id="shieldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d7a7a"/>
      <stop offset="100%" style="stop-color:#1a5f5f"/>
    </linearGradient>
    <linearGradient id="innerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3d9a9a"/>
      <stop offset="100%" style="stop-color:#2d7a7a"/>
    </linearGradient>
  </defs>
</svg>
